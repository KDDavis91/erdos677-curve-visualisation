name: Refresh README screenshots

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/update-readme-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 8000 >/tmp/erdos677-server.log 2>&1 &
          echo $! > /tmp/erdos677-server.pid
          sleep 2

      - name: Capture high-resolution screenshots
        run: |
          mkdir -p assets
          cat > /tmp/capture.js <<'EOF'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 1400, height: 760 },
              deviceScaleFactor: 2
            });
            const page = await context.newPage();

            await page.goto('http://127.0.0.1:8000/index.html', {
              waitUntil: 'networkidle'
            });
            await page.waitForTimeout(1000);

            await page.screenshot({
              path: 'assets/complex-sheets.png',
              fullPage: false
            });

            await page.frameLocator('#codex-visualization').locator('#ec-view').selectOption('real');
            await page.waitForTimeout(700);
            await page.screenshot({
              path: 'assets/real-curve.png',
              fullPage: false
            });

            await page.frameLocator('#codex-visualization').locator('#ec-view').selectOption('lift');
            await page.waitForTimeout(700);
            await page.screenshot({
              path: 'assets/lift-to-intervals.png',
              fullPage: false
            });

            await browser.close();
          })();
          EOF
          node /tmp/capture.js
          file assets/*.png

      - name: Point README at PNG screenshots
        run: |
          sed -i 's#assets/complex-sheets.jpg#assets/complex-sheets.png#g' README.md
          sed -i 's#assets/real-curve.jpg#assets/real-curve.png#g' README.md
          sed -i 's#assets/lift-to-intervals.jpg#assets/lift-to-intervals.png#g' README.md

      - name: Commit refreshed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/complex-sheets.png assets/real-curve.png assets/lift-to-intervals.png
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "Refresh high-resolution README screenshots"
            git push
          fi
